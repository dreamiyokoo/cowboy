# capture 設定ファイル

# ADB 接続設定
adb:
  # 実機接続の場合は "usb", エミュレーターは "emulator-5554" など
  device: "usb"

# API 設定
api:
  base_url: "http://localhost:8002"
  username: ""   # .env の CAPTURE_USERNAME で上書き可
  password: ""   # .env の CAPTURE_PASSWORD で上書き可

# スクリーンショット → 解析 設定
capture:
  # OCR 拡大倍率
  scale: 4

  # 各領域のクロップ座標 [y_start, y_end, x_start, x_end]
  # 実機 1080x2460 の値を想定。端末が変わったら手動で調整してください。

  # 結果ボタン行（カウボーイ勝利 | 抽選 | ノルの勝利）のクロップ座標
  # 「WIN」バッジが他ボタンより明るい → 左1/3→cowboy, 中1/3→draw, 右1/3→bull で判定
  result_crop: [1100, 1300, 30, 1050]

  # オープンカード（テーブル左端の1枚）の全体領域（保存・プレビュー・裏面チェック用）
  open_card_crop: [743, 805, 303, 337]

  # タイマー（カウントダウン秒数表示領域。オープンカードと同じ高さで中央付近）
  timer_crop: [745, 804, 522, 618]

  # オープンカードのランク（数字 A〜K）を認識する絶対座標エリア
  open_card_rank_crop: [745, 780, 303, 337]

  # オープンカードのスート（マーク ♠♥♦♣）を認識する絶対座標エリア
  open_card_suit_crop: [780, 805, 303, 337]

  # ジャックポットストックコイン（オープンカード下・画面中央）
  # "447,744" のような数値が金色テキストで表示される
  jackpot_stock_crop: [935, 970, 400, 680]

  # 勝利ハンドの3行クロップ座標（各行 [y0, y1, x0, x1]）
  # 実測: WIN バッジ行が bright≈0.35、その他 0.07-0.18
  winning_hand_rows:
    - [1385, 1578, 35, 450]   # 手1
    - [1578, 1765, 35, 450]   # 手2
    - [1765, 1952, 35, 450]   # 手3

  # ラウンド番号テキスト「ラウンド: XXXXXX」の領域 [y0, y1, x0, x1]
  # ゲームボード上部の赤いバーに表示される（例: "ラウンド：215244"）
  round_crop: [690, 722, 555, 661]

  # ────── 全11ポジション ベット額ラベル領域 ──────
  # 各ボックスの左上隅にある白いラベル [y0, y1, x0, x1]
  bet_crops:
    # 上段3つ（メイン結果）
    cowboy:    [1140, 1187,  38, 178]
    draw:      [1140, 1187, 378, 508]
    bull:      [1140, 1187, 708, 830]
    # 任意のハンド（左列 x=0-450）
    any_flash: [1400, 1442,  35, 148]   # フラッシュ/コネクト/フラッシュコネクト
    any_pair:  [1578, 1625,  35, 148]   # ワンペア
    any_ace:   [1765, 1812,  35, 148]   # Aのペア
    # 勝利ハンド（右列 x=452-1080、2列×2行+1行）
    win_high:  [1400, 1442, 458, 608]   # ハイカード/ワンペア
    win_two:   [1400, 1442, 748, 908]   # ツーペア
    win_sf:    [1578, 1625, 458, 608]   # スリーカード/ストレート/フラッシュ
    win_fh:    [1578, 1625, 748, 908]   # フルハウス
    win_four:  [1765, 1812, 458, 618]   # フォーオブアカインド/SF/RSF

  win_odds:
    # 上段3つ（メイン結果）
    cowboy:    2.02
    draw:      22
    bull:      2.02
    # 任意のハンド（左列 x=0-450）
    any_flash: 1.67   # フラッシュ/コネクト/フラッシュコネクト
    any_pair:  8.5   # ワンペア
    any_ace:   100   # Aのペア
    # 勝利ハンド（右列 x=452-1080、2列×2行+1行）
    win_high:  2.2   # ハイカード/ワンペア
    win_two:   3.1   # ツーペア
    win_sf:    4.7   # スリーカード/ストレート/フラッシュ
    win_fh:    20.5   # フルハウス
    win_four:  250   # フォーオブアカインド/SF/RSF

  # ────── 各ポジション WIN判定領域 (ボックス全体) ──────
  # V>220ピクセル比率 ≥ 0.30 で WIN と判定
  # 上段3つはメイン result フィールドで判定するため不要
  win_regions:
    any_flash: [1375, 1560,  30, 420]
    any_pair:  [1565, 1760,  30, 420]
    any_ace:   [1755, 1960,  30, 420]
    win_high:  [1375, 1555, 472, 762]
    win_two:   [1385, 1565, 762, 1040]
    win_sf:    [1575, 1765, 472, 752]
    win_fh:    [1575, 1765, 762, 1040]
    win_four:  [1780, 1960, 472, 1040]

# タイミング設定
# ゲームの流れ:
#   [オープンカード表示 ~10秒] → [カウントダウン 15秒] → [結果表示 数秒] → 繰り返し
#   合計 1ラウンド約25秒
timing:
  # 結果投稿後、次ラウンドの検出を開始するまでのクールダウン（秒）
  # ゲームのタイミング: 結果表示 → 次カードオープンまで5秒程度
  # 18秒設定だとカードオープンをまるごと見逃すため 5 秒に変更
  post_round_cooldown: 5

  # 結果待ち中のポーリング間隔（秒）: 短く設定して取り逃がしを防ぐ
  poll_fast: 0.5

  # クールダウン中のポーリング間隔（秒）: CPU負荷軽減
  poll_idle: 1

  # 結果を「確定」とみなすのに必要な連続検出回数
  # スピードが向上したため、2回連続検出で誤検出を防ぎつつ確実に確定可能に
  result_stable_count: 2

  # BETTING 開始から結果チェックを開始するまでの待機秒数
  # タイマー最大値が15sのため、タイマーOCR失敗時のフォールバックとして15sに設定
  result_check_delay: 15

  # 結果検出のタイムアウト（秒）
  # result_check_delay(15) + 結果表示時間(5) + 余裕(10) = 30
  # 1ラウンド≈25sのため45sは長すぎてラウンドをまたいでしまう
  result_timeout: 30

# フレームハング検出設定
hang_detect:
  # 同じフレームが何回連続したらハング判定するか（threshold回）
  threshold: 5

  # ハング判定の時間ウィンドウ（秒）
  # この時間以上前のフレーム履歴は破棄される
  timeout_seconds: 10
